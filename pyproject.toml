"os.posix_spawn".msg = "Process calls belong to the launch owners, tests that drive git, and the verify script."
"os.posix_spawnp".msg = "Process calls belong to the launch owners, tests that drive git, and the verify script."
"os.execl".msg = "Process calls belong to the launch owners, tests that drive git, and the verify script."
"os.execle".msg = "Process calls belong to the launch owners, tests that drive git, and the verify script."
"os.execlp".msg = "Process calls belong to the launch owners, tests that drive git, and the verify script."
"os.execlpe".msg = "Process calls belong to the launch owners, tests that drive git, and the verify script."
