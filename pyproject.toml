[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esme-pretrain"
version = "0.0.0"
description = "Small base-model pretraining lab with fixed eval and export."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Adam Thuvesen" }]
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.12",
  "tokenizers>=0.21",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = [
  "basedpyright==1.40.2",
  "import-linter>=2.15",
  "modal==1.5.0",
  "plotly>=6.1",
  "pytest>=8.2",
  "pytest-xdist>=3.8",
  "ruff==0.17.4",
  "wandb>=0.19",
]
baselines = [
  "lm-eval==0.4.12",
  "transformers>=4.55",
  "datasets>=3.0",
  "accelerate>=1.0",
  "zstandard>=0.23",
]

[project.scripts]
esme-pretrain = "esme_pretrain.cli:main"

[tool.pytest.ini_options]
addopts = "-q -m 'not network and not slow'"
markers = [
  "network: downloads real models or datasets; opt in with `pytest -m network`",
  "slow: offline but too slow for `make check`; run with `make slow`",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "PGH003"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
include = ["src", "scripts", "tests"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false

[tool.importlinter]
root_package = "esme_pretrain"

[[tool.importlinter.contracts]]
name = "Study owns its protocol without CLI, launch, or post-run dependencies"
type = "forbidden"
source_modules = ["esme_pretrain.study"]
forbidden_modules = ["esme_pretrain.cli", "esme_pretrain.launch", "esme_pretrain.postrun"]

[[tool.importlinter.contracts]]
name = "Launch must not depend on CLI policy"
type = "forbidden"
source_modules = ["esme_pretrain.launch"]
forbidden_modules = ["esme_pretrain.cli"]

[[tool.importlinter.contracts]]
name = "Artifact and data domains do not depend on operations"
type = "forbidden"
source_modules = [
  "esme_pretrain.artifacts",
  "esme_pretrain.data",
]
forbidden_modules = [
  "esme_pretrain.cli", "esme_pretrain.launch", "esme_pretrain.postrun",
  "esme_pretrain.baselines", "esme_pretrain.study", "esme_pretrain.training",
  "esme_pretrain.pretrain_run", "esme_pretrain.pretrain_config",
]

[[tool.importlinter.contracts]]
name = "Modeling and torch are independent of data and operations"
type = "forbidden"
source_modules = ["esme_pretrain.modeling", "esme_pretrain.torch"]
forbidden_modules = [
  "esme_pretrain.artifacts", "esme_pretrain.data", "esme_pretrain.training",
  "esme_pretrain.cli", "esme_pretrain.launch", "esme_pretrain.postrun",
  "esme_pretrain.baselines", "esme_pretrain.study",
  "esme_pretrain.pretrain_run", "esme_pretrain.pretrain_config",
]

[[tool.importlinter.contracts]]
name = "Training does not depend on operation policy"
type = "forbidden"
source_modules = ["esme_pretrain.training"]
forbidden_modules = [
  "esme_pretrain.cli", "esme_pretrain.launch", "esme_pretrain.postrun",
  "esme_pretrain.baselines", "esme_pretrain.study",
  "esme_pretrain.pretrain_run", "esme_pretrain.pretrain_config",
]
