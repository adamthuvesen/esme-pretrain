[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esme-pretrain"
version = "0.0.0"
description = "Small base-model pretraining lab with fixed eval and export."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Adam Thuvesen" }]
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.12",
  "tokenizers>=0.21",
  "torch==2.12.1",
]

[project.optional-dependencies]
dev = [
  "basedpyright==1.40.2",
  "import-linter>=2.15",
  "modal==1.5.0",
  "plotly>=6.1",
  "pytest>=8.2",
  "pytest-xdist>=3.8",
  "ruff==0.17.4",
  "wandb>=0.19",
]
baselines = [
  "lm-eval==0.4.12",
  "transformers>=4.55",
  "datasets>=3.0",
  "accelerate>=1.0",
  "zstandard>=0.23",
]

[project.scripts]
esme-pretrain = "esme_pretrain.cli:main"

[tool.pytest.ini_options]
addopts = "-q --strict-markers -m 'not network and not slow'"
markers = [
  "network: downloads real models or datasets; opt in with `pytest -m network`",
  "slow: offline but too slow for `make check`; run with `make slow`",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "PGH003", "PGH004", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/esme_pretrain/launch/gpu_smoke.py" = ["TID251"]
"src/esme_pretrain/launch/modal_artifacts.py" = ["TID251"]
"src/esme_pretrain/launch/scaling_study.py" = ["TID251"]
"src/esme_pretrain/launch/throughput_bench.py" = ["TID251"]
"scripts/modal_pretrain.py" = ["TID251"]
"src/esme_pretrain/training/metrics.py" = ["TID251"]
"tests/test_repo_rules.py" = ["TID251"]
"tests/test_scaling_study.py" = ["TID251"]
"tests/test_strict_mode.py" = ["TID251"]
".agents/skills/verify-esme-pretrain/verify" = ["TID251"]

