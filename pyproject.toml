[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
include = ["src", "scripts", "tests"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false

[tool.importlinter]
root_package = "esme_pretrain"

[[tool.importlinter.contracts]]
name = "esme_pretrain modules import only lower layers in the pyproject.toml layers list; move shared code down a layer"
type = "layers"
containers = ["esme_pretrain"]
exhaustive = true
layers = [
  "__main__",
  "cli",
  "baselines",
  "launch | postrun",
  "study | pretrain_run",
  "training | pretrain_config",
  "data | modeling",
  "artifacts | torch | status",
]

[[tool.importlinter.contracts]]
name = "esme_pretrain.modeling must not import esme_pretrain.artifacts; let the caller pass artifact data in"
type = "forbidden"
source_modules = ["esme_pretrain.modeling"]
forbidden_modules = ["esme_pretrain.artifacts"]
